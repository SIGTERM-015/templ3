name: Deploy CMS

on:
  push:
    branches:
      - main
    paths:
      - 'apps/cms/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'patches/**'
  workflow_dispatch:

# Never cancel a running CMS deploy — migrations must not be interrupted.
concurrency:
  group: deploy-cms
  cancel-in-progress: false

jobs:
  test:
    name: Lint & Test CMS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: templ3
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/templ3
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://postgres:postgres@localhost:5432/templ3
      PAYLOAD_SECRET: ci-only-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir apps/cms exec tsc --noEmit

      - name: Lint
        run: pnpm --dir apps/cms lint

      - name: Integration tests
        run: pnpm --dir apps/cms run test:int

  deploy:
    name: Migrate & Deploy CMS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --forceAcceptWarning: the prod DB has a dev-mode marker row in
      # payload_migrations (from a past `payload dev` push). Without this flag
      # `payload migrate` prompts interactively, which hangs in CI (no TTY).
      - name: Run database migrations
        run: pnpm --dir apps/cms run payload migrate --forceAcceptWarning
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_URL_PROD }}

      - name: Build
        run: pnpm cf:build:cms
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_URL_PROD }}

      - name: Deploy
        run: pnpm --dir apps/cms exec wrangler deploy
        env:
          NODE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_URL_PROD }}
